<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <!-- Top arc path for circular text -->
    <path id="ohsms-arc-top" d="M 30,100 A 70,70 0 1,1 170,100" fill="none" />
    <!-- Bottom arc path for circular text -->
    <path id="ohsms-arc-bottom" d="M 170,100 A 70,70 0 0,1 30,100" fill="none" />
  </defs>
  
  <!-- Outer double rings -->
  <circle cx="100" cy="100" r="95" fill="#ffffff" stroke="#111827" stroke-width="3" />
  <circle cx="100" cy="100" r="88" fill="none" stroke="#111827" stroke-width="1.5" stroke-dasharray="3,2" />
  <circle cx="100" cy="100" r="62" fill="none" stroke="#111827" stroke-width="2" />
  
  <!-- Curved Upper Text: HEALTH & SAFETY -->
  <text font-family="Arial, Helvetica, sans-serif" font-size="8.5" font-weight="900" fill="#111827" letter-spacing="1">
    <textPath href="#ohsms-arc-top" startOffset="50%" text-anchor="middle">
      CERTIFIED OCCUPATIONAL SAFETY
    </textPath>
  </text>
  
  <!-- Center: ISO 45001 -->
  <text x="100" y="93" font-family="'Arial Black', Impact, sans-serif" font-size="25" font-weight="900" fill="#b45309" text-anchor="middle" letter-spacing="0.5">ISO</text>
  <text x="100" y="120" font-family="'Arial Black', Impact, sans-serif" font-size="21" font-weight="900" fill="#111827" text-anchor="middle" letter-spacing="0.5">45001</text>
  
  <!-- Red SwissCert Stamp slant overlay -->
  <g transform="rotate(30 100 100)">
    <rect x="80" y="142" width="84" height="15" rx="3" fill="#dc2626" opacity="0.9" />
    <text x="122" y="153" font-family="'Arial Black', sans-serif" font-size="9" font-weight="bold" fill="#ffffff" text-anchor="middle" letter-spacing="0.8">SWISSCERT</text>
  </g>
</svg>
